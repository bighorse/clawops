# ClawOps configuration example — copy to clawops.toml and edit.

[server]
host = "127.0.0.1"
port = 8088

[database]
# Relative paths are resolved against the working directory.
url = "sqlite://data/clawops.db?mode=rwc"

[zeroclaw]
# Path to the zeroclaw binary used when spawning per-user daemons.
binary = "/usr/local/bin/zeroclaw"
# Base directory for per-user homes. Each user lives at <home_base>/claw-<linux_uid>.
home_base = "/home"
# Port pool for per-user zeroclaw gateways.
port_range_start = 42618
port_range_end = 50000

[provisioner]
# "systemd" (Linux) or "mock" (dev / macOS). Mock writes provisioning steps to log only.
backend = "mock"
# Template directory bundled with the ClawOps install.
template_dir = "templates/workspace"

# ── LLM defaults injected into each rendered per-user config.toml ───
# These centralise the model/provider so individual users don't repeat
# secrets. Prefer leaving api_key empty here and exporting
# ZEROCLAW_API_KEY in the per-user systemd unit.
[zeroclaw_template]
default_provider = "qwen"
default_model = "qwen3.6-plus"
api_key = ""
# api_url = "https://dashscope.aliyuncs.com/compatible-mode/v1"
default_temperature = 0.6
provider_timeout_secs = 120
max_cost_per_day_cents = 500
# Tavily API key for the web_search tool. Free tier (1000/mo) at
# https://app.tavily.com — empty falls back to DuckDuckGo (no key).
tavily_api_key = ""

[wx]
# Platform backend that exchanges wx.login `code` for `openid`.
# ClawOps does NOT call WeChat's jscode2session directly — the upstream
# backend already holds the AppSecret and consumes the (single-use) code.
# Endpoint shape:
#   POST {backend_base_url}/message/wechat/applets/{app_id}/open_id
#   body: {"code": "<wx.login code>", "client": "clawops"}
#   200:  {"data": {"open_id": "..."}}
#   403:  unconfigured app_id   500: code expired/used
# Leave empty for local dev — mini-program then sends `mock_openid` directly.
backend_base_url = "https://bdhrapi.2048office.com"
# Backend P99 is hundreds of ms; 30s tolerates upstream WeChat hiccups.
exchange_timeout_secs = 30

[reaper]
# Minutes of idle time (based on users.last_active_at) before stopping a process.
# Phase 1 default: 90 days. Set low values for testing.
idle_stop_minutes = 129600
# Archive status threshold (not acted on yet, recorded for future Phase).
idle_archive_minutes = 525600

[admin]
# Required token for any /admin/* request — sent as `X-Admin-Token: <token>`.
# Leave empty to **disable** all /admin/* routes (returns 503).
# Generate with: openssl rand -hex 32
token = ""

[lead]
# Webhook to notify ops when a user leaves contact info during chat
# (cross-sell, commodity inquiry, custom build interest, etc).
# Lark/Feishu custom bot URL example:
#   https://open.feishu.cn/open-apis/bot/v2/hook/abcd-efgh-1234
# Empty = no notification (LLM falls back to memory_store only — opaque
# to ops, transcripts are dead leads).
webhook_url = ""
# "feishu" (Lark text body) or "raw" (plain JSON). Other vendors TBD.
webhook_format = "feishu"

[rate_limit]
# All limits are sliding-window per minute, in-memory (reset on restart).
# Source IP is read from X-Forwarded-For first hop (trusted because nginx
# is the only thing that can reach 127.0.0.1:8088 in production).
wx_login_per_ip_per_min = 10
chat_per_user_per_min = 30
admin_per_ip_per_min = 60

[commodity]
# Platform commodity / service-product catalogue API. The ClawOps
# provisioner injects api_base + detail_path_template into every user's
# rendered SKILL.md so the in-daemon LLM knows where to query and how
# to format product detail links.
# Empty api_base disables the commodity skill.
api_base = "https://bdhrapi.2048office.com/commodity"
# `{id}` is the literal placeholder the LLM substitutes per product.
# Example outputs: /pages/products/detail?id=42
detail_path_template = "/pages/products/detail?id={id}"

[activity]
# Community-event catalogue API (forums / roadshows / matchmaking /
# training sessions held in Huairou Science City). Same shape as
# [commodity]: provisioner injects api_base + detail_path_template
# into the activity-recommend SKILL. Empty api_base disables the skill.
# Endpoints sit under /shared/event/* — the api_base points at that
# subtree so the SKILL can reach list/detail without repeating the
# /shared/event prefix.
api_base = "https://bdhrapi.2048office.com/shared/event"
detail_path_template = "/pages/activity/details/Index?obj_id={id}"

[policy]
# Policy catalogue API (national / Beijing / Huairou-district policies
# affecting park enterprises, plus declarations, announcements, FAQs,
# categories). Empty api_base disables the policy skill.
api_base = "https://bdhrapi.2048office.com/policies"
detail_path_template = "/pages/policy/detail?id={id}"

[space]
# Space-resource catalogue API (园区 / 众创空间 / 厂房 / 独立办公室 /
# 工位 / 产业用地). Unlike commodity/activity/policy, **no enable
# toggle** — the space-recommend skill is always rendered. Whole
# [space] table can be omitted; defaults below match production.
api_base = "https://bdhrapi.2048office.com/space-v2"
# Mini-program path the LLM puts in markdown links for park-class
# resources (parks themselves, plus child workshops linked back to
# their parent park). `{id}` substituted with the API id at render.
park_detail_path_template = "/pages/space/park?id={id}"
# Mini-program path for maker-space-class resources (maker_space
# itself, plus child offices/stations linked back to their parent).
maker_space_detail_path_template = "/pages/space/makerDetail?id={id}"

[general_information]
# Static-knowledge skill carrying the Huairou Science City service
# handbook (6 大科学装置 / 14 交叉平台 / 17 科教设施 / 政策清单 /
# 入驻流程 / 联络方式) inlined into each user's prompt. No external
# API — flipping enabled=false simply skips rendering the SKILL.md
# so the daemon LLM no longer holds (and won't try to answer with)
# that knowledge.
enabled = true
